<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b9df6">
<title>アイカツ！求めリスト</title>
<style>
:root{--blue:#5b9df6;--blue2:#8bc8ff;--pale:#eaf6ff;--deep:#3e6fb5;--ink:#35516f}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#eaf6ff 0,#f8fbff 240px,#fff 100%);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--ink)}
header{padding:22px 14px 14px;text-align:center}
.notice{max-width:1000px;margin:0 auto 14px;padding:14px 16px;background:#fff;border:1px solid #dceeff;border-radius:14px;box-shadow:0 2px 7px #8abcf022;font-size:13px;line-height:1.8;color:var(--ink)}
.noticeTitle{font-weight:800;color:var(--deep);margin-bottom:4px}
.notice p{margin:4px 0}
.notice a{color:#347fc5;font-weight:800;text-decoration:underline}
h1{font-size:21px;color:var(--deep);margin:0 0 7px;font-weight:800}
.sub{font-size:12px;color:#7290ad}
.tabs{padding:0 12px 12px;max-width:1000px;margin:auto}
.tabs select{width:100%;border:1px solid #c8e3ff;background:#fff;color:var(--deep);border-radius:13px;padding:13px 14px;font-size:15px;font-weight:700;box-shadow:0 2px 7px #8abcf022;}
.toolbarActions{display:flex;align-items:center;gap:8px}
.headerTitle{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;max-width:1000px;margin:0 auto}
.headerTitle h1{margin:0}
.settingsButton{position:absolute;right:0;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#65c5ef;padding:3px;filter:drop-shadow(0 2px 2px #79c9e955)}
.settingsButton svg{width:31px;height:31px;display:block}
.settingsButton:active{background:#e4f7ff}
.settingsPanel{margin:0 12px 12px;padding:13px;border:1px solid #dceaff;border-radius:13px;background:#f8fbff}
.settingsHeading{font-weight:800;color:var(--deep);margin-bottom:8px}
.settingsRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #e5effa;font-size:13px}
.settingsRow button,.settingsPanel>.save{border:1px solid #cfe2f8;border-radius:8px;background:#fff;color:var(--deep);padding:8px 11px;font-weight:700}
.settingsPanel button:disabled{opacity:.5}
.settingsPanel>.save{margin-top:8px;background:#e8f3ff}
.toolbar{max-width:1000px;margin:0 auto 12px;padding:0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-size:13px;font-weight:700;color:var(--deep)}
.auth{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.auth button,.save,.viewerTools button{border:1px solid #c8e3ff;background:#fff;color:var(--deep);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:700}
.viewerTools{max-width:1000px;margin:0 auto 12px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--deep)}
.viewerTools button{background:var(--blue);color:white;border:0}.viewerTools button:disabled{opacity:.45}
#listPreview{max-width:1000px;margin:0 auto 22px;padding:0 12px;display:grid;gap:14px}
.previewPage{background:#fff;border:1px solid #dceeff;border-radius:14px;padding:12px;box-shadow:0 3px 12px #6da7d51a}
.previewPage img{display:block;width:100%;height:auto;border-radius:8px;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto;touch-action:pan-y}
.previewHint{text-align:center;color:#7290ad;font-size:12px;font-weight:700;margin:2px 0 10px}
.previewActions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;font-size:12px;color:var(--deep);font-weight:700}
.previewActions a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;border-radius:10px;padding:9px 13px}
.pick{position:absolute;left:5px;bottom:5px;z-index:2;background:#ffffffed;border-radius:8px;padding:4px 6px;font-size:11px;font-weight:700;color:var(--deep);display:flex;align-items:center;gap:3px}.pick input{width:16px;height:16px;margin:0;accent-color:var(--blue)}
.authStatus{font-size:11px;color:#7893ad}
.save{background:var(--blue);color:white;border:0}
.grid{max-width:1100px;margin:auto;padding:0 8px 30px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{position:relative;border:2px solid #dceeff;border-radius:10px;background:#fff;padding:3px;overflow:hidden;box-shadow:0 2px 6px #6da7d51a;aspect-ratio:.72;display:flex;align-items:center;justify-content:center}
.tile img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.tile.priority{border-color:#f3c95b;box-shadow:0 0 0 2px #ffe8a4}
.star{position:absolute;right:4px;top:4px;border:0;border-radius:50%;width:27px;height:27px;background:#ffffffed;color:#9aabbc;font-size:17px;line-height:1;display:none;padding:0}
.tile.isAdmin .star{display:block}
.tile.priority .star{color:#f0ad00}
.tile.reorderSelected{border-color:#55bce9;box-shadow:0 0 0 3px #a9e8ff,0 4px 12px #65c5ef55;transform:scale(.98)}
.reorderPad{position:fixed;z-index:20;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:190px;padding:9px 12px 11px;border:1px solid #bfe5ff;border-radius:18px;background:#ffffffef;box-shadow:0 4px 18px #4776a544;backdrop-filter:blur(8px);display:none;text-align:center}
.reorderPad.visible{display:block}
.reorderPadLabel{font-size:11px;font-weight:800;color:var(--deep);margin-bottom:7px;white-space:nowrap}
.directionPad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,42px);justify-content:center;gap:5px}
.directionPad button[data-direction="up"]{grid-column:2;grid-row:1}
.directionPad button[data-direction="left"]{grid-column:1;grid-row:2}
.directionPad button[data-direction="down"]{grid-column:2;grid-row:3}
.directionPad button[data-direction="right"]{grid-column:3;grid-row:2}
.directionPad button{border:1px solid #b8def8;border-radius:12px;background:linear-gradient(180deg,#f5fbff,#dff2ff);color:#4a9bd0;font-size:23px;font-weight:900;line-height:1;box-shadow:0 2px 3px #75bce533;touch-action:manipulation}
.directionPad button:active:not(:disabled){background:#c6eaff;transform:translateY(1px)}
.directionPad button:disabled{opacity:.3}
.grid.reorderActive{padding-bottom:145px}
.orderControls{position:absolute;left:3px;right:3px;bottom:3px;display:none;grid-template-columns:repeat(2,1fr);gap:3px;padding:3px;border-radius:8px;background:#ffffffed;box-shadow:0 1px 5px #4776a533}
.tile.isAdmin .orderControls{display:grid}
.orderControls button{border:0;border-radius:6px;background:#e8f3ff;color:var(--deep);font-size:14px;font-weight:700;min-width:0;height:27px;padding:0;touch-action:manipulation}
.orderControls button:active{background:#c9e3ff}
.orderControls button:disabled{opacity:.3}
.empty{grid-column:1/-1;text-align:center;color:#91a8bf;padding:40px 10px;font-size:14px}
.foot{text-align:center;color:#9ab0c5;font-size:11px;padding:0 10px 25px}
@media(max-width:380px){.grid{gap:5px;padding-left:5px;padding-right:5px}.tile{padding:2px;border-radius:7px}}
@media(min-width:700px){.grid{gap:12px;padding-left:14px;padding-right:14px}.tile{border-radius:13px;padding:5px}.tab{font-size:15px}}
</style>
</head>
<body>
<header><div class="headerTitle"><h1>アイカツ！求めリスト</h1><button id="settingsButton" class="settingsButton" type="button" aria-label="設定" aria-expanded="false"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M20.2 4.8h7.6l1.3 5.1a15 15 0 0 1 3.3 1.4l4.6-2.5 5.4 5.4-2.5 4.6a15 15 0 0 1 1.4 3.3l5.1 1.3v7.6l-5.1 1.3a15 15 0 0 1-1.4 3.3l2.5 4.6-5.4 5.4-4.6-2.5a15 15 0 0 1-3.3 1.4l-1.3 5.1h-7.6l-1.3-5.1a15 15 0 0 1-3.3-1.4L11 45.6l-5.4-5.4 2.5-4.6a15 15 0 0 1-1.4-3.3l-5.1-1.3v-7.6l5.1-1.3a15 15 0 0 1 1.4-3.3l-2.5-4.6L11 8.8l4.6 2.5a15 15 0 0 1 3.3-1.4z" transform="translate(2 0) scale(.92)" fill="#bdeaff" stroke="#65c5ef" stroke-width="1.8" stroke-linejoin="round"/><circle cx="24" cy="24" r="8" fill="#f7fdff" stroke="#65c5ef" stroke-width="2.5"/><circle cx="24" cy="24" r="3" fill="#8bd8f5"/></svg></button></div><div class="sub">シリーズを選んで画像をチェック ✧</div></header>
<section class="notice">
  <div class="noticeTitle">【お取引について】</div>
  <p>お声がけの際は、X（<a href="https://x.com/__DAKKI__" target="_blank" rel="noopener noreferrer">@__DAKKI__</a>）までご連絡をお願いいたします。</p>
  <p>初代、アンコール、プロモ類は白かけや傷のないもの<br>スターズ、フレンズ、オンパレードはフレームなしデフォルト柄を最優先で求めています。</p>
</section>
<nav class="tabs" id="tabs"></nav>
<div class="toolbar">
  <div class="count" id="count">画像を読み込み中…</div>
  <div class="toolbarActions"><button id="refreshButton" type="button">↻ 最新状態に更新</button></div>
</div>
<section class="settingsPanel" id="settingsPanel" hidden>
  <div class="settingsHeading">⚙️ 設定</div>
  <div class="settingsRow"><span>ログイン状態</span><span class="authStatus" id="authStatus">閲覧モード</span></div>
  <div class="settingsRow"><span>管理者ログイン</span><div><button id="loginButton" type="button">ログイン</button><button id="logoutButton" type="button" hidden>ログアウト</button></div></div>
  <div class="settingsRow"><span>並び替え</span><button id="reorderButton" type="button" disabled>管理者ログイン後に利用できます</button></div>
  <button class="save" id="saveButton" type="button" hidden>並び順を保存</button>
</section>
<div class="viewerTools"><span id="selectedCount">0枚選択中</span><button id="makeListButton" type="button" disabled>お譲り可能リストを画像化</button></div>
<section id="listPreview" aria-live="polite"></section>
<main class="grid" id="grid"></main>
<section class="reorderPad" id="reorderPad" aria-label="カード移動コントローラー"><div class="reorderPadLabel" id="reorderPadLabel">カードをタップして選択</div><div class="directionPad"><button type="button" data-direction="up" aria-label="上へ">↑</button><button type="button" data-direction="left" aria-label="左へ">←</button><button type="button" data-direction="down" aria-label="下へ">↓</button><button type="button" data-direction="right" aria-label="右へ">→</button></div></section>
<div class="foot">画像一覧専用ページ</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const SERIES=['初代','スターズ','フレンズ','オンパレード','アンコール','プロモーション'];
const ADMIN_EMAIL='dakki0918@gmail.com';
const firebaseConfig={apiKey:"AIzaSyBJv3OxAeIHluwUWeqo5b2gqcZpyE3RVl4",authDomain:"aikatsu-stars-card-checker.firebaseapp.com",projectId:"aikatsu-stars-card-checker",storageBucket:"aikatsu-stars-card-checker.firebasestorage.app",messagingSenderId:"824065060047",appId:"1:824065060047:web:c1d470456783a582595bba"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let current='すべて',imageUrls={},imageEntries={},loadingImages={},orders={},priority=[],selected=new Set(),currentUser=null,isAdmin=false,reorderMode=false,dirty=false,reorderTarget=null;
const tabs=document.getElementById('tabs'),grid=document.getElementById('grid'),count=document.getElementById('count');
const reorderPad=document.getElementById('reorderPad'),reorderPadLabel=document.getElementById('reorderPadLabel');
const authStatus=document.getElementById('authStatus'),refreshButton=document.getElementById('refreshButton'),settingsButton=document.getElementById('settingsButton'),settingsPanel=document.getElementById('settingsPanel'),reorderButton=document.getElementById('reorderButton'),selectedCount=document.getElementById('selectedCount'),makeListButton=document.getElementById('makeListButton'),listPreview=document.getElementById('listPreview'),loginButton=document.getElementById('loginButton'),logoutButton=document.getElementById('logoutButton'),saveButton=document.getElementById('saveButton');
const stateRef=db.collection('tradeGallery').doc('main');
function seriesFiles(s){return Object.keys(imageEntries).filter(p=>s==='すべて'?p.startsWith('images/'):p.startsWith('images/'+s+'/'))}
function updateSelectionUI(){selectedCount.textContent=selected.size+'枚選択中';makeListButton.disabled=!selected.size}
async function loadOneImage(path,img){if(imageUrls[path]){img.src=imageUrls[path];return}if(!loadingImages[path]){loadingImages[path]=imageEntries[path].async('blob').then(blob=>{imageUrls[path]=URL.createObjectURL(blob);return imageUrls[path]}).finally(()=>delete loadingImages[path])}try{const url=await loadingImages[path];if(img.isConnected)img.src=url}catch(e){img.alt='画像を読み込めません'}}
const imageObserver='IntersectionObserver' in window?new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){const img=entry.target;imageObserver.unobserve(img);loadOneImage(img.dataset.path,img)}}),{rootMargin:'250px'}):null;
function orderedFiles(s){
 if(s==='最優先'){
  const files=orderedFiles('すべて').filter(p=>priority.includes(p)),saved=orders['最優先']||[];
  const valid=saved.filter(p=>files.includes(p)),added=files.filter(p=>!valid.includes(p));
  return [...valid,...added];
 }
 if(s==='すべて'){
  const files=SERIES.flatMap(name=>orderedFiles(name)),saved=orders['すべて']||[];
  const valid=saved.filter(p=>files.includes(p)),added=files.filter(p=>!valid.includes(p));
  return [...valid,...added].sort((a,b)=>Number(priority.includes(b))-Number(priority.includes(a)));
 }
 const files=seriesFiles(s),saved=orders[s]||[],valid=saved.filter(p=>files.includes(p)),added=files.filter(p=>!valid.includes(p)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
 return [...valid,...added].sort((a,b)=>Number(priority.includes(b))-Number(priority.includes(a)) || (priority.includes(a)&&priority.includes(b)?(saved.indexOf(a)-saved.indexOf(b)):0));
}
function markDirty(){dirty=true;saveButton.hidden=!isAdmin;authStatus.textContent='未保存の変更あり'}
function renderTabs(){tabs.innerHTML='';const select=document.createElement('select');select.setAttribute('aria-label','シリーズを選択');[['すべて','すべて'],['最優先','★ 最優先'],...SERIES.map(s=>[s,s])].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;select.appendChild(option)});select.value=current;select.onchange=()=>{current=select.value;reorderTarget=null;render()};tabs.appendChild(select)}
function render(){
 const files=orderedFiles(current);grid.classList.toggle('reorderActive',isAdmin&&reorderMode);reorderPad.classList.toggle('visible',isAdmin&&reorderMode);count.textContent=current+'　'+files.length+'枚'+(current==='すべて'||current==='最優先'?'':(priority.filter(p=>p.startsWith('images/'+current+'/')).length?'　⭐最優先 '+priority.filter(p=>p.startsWith('images/'+current+'/')).length+'枚':''));
 grid.innerHTML='';
 if(!files.length){grid.innerHTML='<div class="empty">このシリーズの画像がありません</div>';return}
 files.forEach(path=>{
  const box=document.createElement('div');box.className='tile'+(priority.includes(path)?' priority':'')+(isAdmin&&reorderMode?' isAdmin':'')+(reorderTarget===path?' reorderSelected':'');box.dataset.path=path;
  const img=document.createElement('img');img.loading='lazy';img.alt='';img.dataset.path=path;box.appendChild(img);if(imageObserver)imageObserver.observe(img);else loadOneImage(path,img);
  if(!(isAdmin&&reorderMode)){const pick=document.createElement('label');pick.className='pick';const check=document.createElement('input');check.type='checkbox';check.dataset.path=path;check.checked=selected.has(path);check.onchange=()=>{if(check.checked)selected.add(path);else selected.delete(path);updateSelectionUI()};pick.append(check,document.createTextNode('選択'));box.appendChild(pick);}
  if(isAdmin&&reorderMode){box.onclick=()=>{reorderTarget=path;render()}}
  grid.appendChild(box);
 });
 updateSelectionUI();
}
async function loadGalleryState(){
 try{
  const snap=await stateRef.get();
  if(snap.exists){const data=snap.data()||{};orders=data.orders||{};priority=Array.isArray(data.priority)?data.priority:[]}
 }catch(e){console.warn('Gallery settings could not be read',e);authStatus.textContent='並び順の読み込み待ち'}
}
async function saveGalleryState(){
 if(!isAdmin)return;
 orders[current]=[...grid.querySelectorAll('.tile')].map(el=>el.dataset.path);
 const allOrders={...orders};
 for(const s of SERIES){const files=seriesFiles(s),saved=allOrders[s]||[];allOrders[s]=[...saved.filter(p=>files.includes(p)),...files.filter(p=>!saved.includes(p)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}))]}
 const allFiles=SERIES.flatMap(s=>seriesFiles(s)),allSaved=allOrders['すべて']||[];
 allOrders['すべて']=[...allSaved.filter(p=>allFiles.includes(p)),...allFiles.filter(p=>!allSaved.includes(p))];
 try{
  await stateRef.set({orders:allOrders,priority:priority.filter(p=>Object.prototype.hasOwnProperty.call(imageEntries,p)),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  orders=allOrders;dirty=false;saveButton.hidden=true;authStatus.textContent='保存しました';render();
 }catch(e){console.error(e);authStatus.textContent='保存できません（Firestoreルールを確認）'}
}
saveButton.onclick=saveGalleryState;
settingsButton.onclick=()=>{settingsPanel.hidden=!settingsPanel.hidden;settingsButton.setAttribute('aria-expanded',String(!settingsPanel.hidden))};
reorderButton.onclick=()=>{if(!isAdmin)return;reorderMode=!reorderMode;reorderTarget=null;reorderButton.textContent=reorderMode?'並び替えモード：ON':'並び替えモード：OFF';render()};
reorderPad.querySelectorAll('[data-direction]').forEach(button=>{
 button.addEventListener('click',()=>{
  if(!isAdmin||!reorderMode||!reorderTarget)return;
  const tiles=[...grid.querySelectorAll('.tile')];
  const paths=tiles.map(tile=>tile.dataset.path);
  const from=paths.indexOf(reorderTarget);
  if(from<0)return;
  const columns=Math.max(1,tiles.length?getComputedStyle(grid).gridTemplateColumns.trim().split(/\\s+/).length:1);
  const direction=button.dataset.direction;
  let to=from;
  if(direction==='left'&&from%columns!==0)to=from-1;
  if(direction==='right'&&from%columns!==columns-1&&from+1<paths.length)to=from+1;
  if(direction==='up'&&from-columns>=0)to=from-columns;
  if(direction==='down'&&from+columns<paths.length)to=from+columns;
  if(to===from)return;
  const moved=paths.splice(from,1)[0];
  paths.splice(to,0,moved);
  orders[current]=paths;
  render();
  markDirty();
 });
});
loginButton.onclick=async()=>{
 loginButton.disabled=true;authStatus.textContent='ログイン中…';
 try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
 catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){try{await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());return}catch(er){e=er}}authStatus.textContent='ログイン失敗：'+(e.message||e.code)}
 finally{loginButton.disabled=false}
};
logoutButton.onclick=()=>auth.signOut();
auth.getRedirectResult().catch(e=>{authStatus.textContent='ログイン失敗：'+(e.message||e.code)});
auth.onAuthStateChanged(user=>{
 currentUser=user;isAdmin=!!user&&String(user.email||'').toLowerCase()===ADMIN_EMAIL;
 loginButton.hidden=isAdmin;logoutButton.hidden=!isAdmin;reorderButton.disabled=!isAdmin;
 if(!isAdmin){reorderMode=false;reorderTarget=null;}
 reorderButton.textContent=reorderMode?'並び替えモード：ON':'並び替えモード：OFF';
 authStatus.textContent=isAdmin?'管理者ログイン中':user?'閲覧モード（編集権限なし）':'未ログイン';
 saveButton.hidden=!(isAdmin&&dirty);render();
});
async function loadImages(){
 try{
  const forceFresh=new URLSearchParams(location.search).has('refresh');const response=await fetch(forceFresh?'aikatsu-images.zip?v='+Date.now():'aikatsu-images.zip',forceFresh?{cache:'no-store'}:{});if(!response.ok)throw new Error('ZIP missing');
  const zip=await JSZip.loadAsync(await response.arrayBuffer(),{decodeFileName:bytes=>new TextDecoder('utf-8').decode(bytes)});
  const entries=Object.keys(zip.files).filter(path=>!zip.files[path].dir&&!path.startsWith('__MACOSX/')&&!path.split('/').some(part=>part.startsWith('._')));
  for(const originalPath of entries){
   const parts=originalPath.normalize('NFC').split('/');
   if(parts[0]==='aikatsu-images')parts.shift();
   if(parts[0]==='images')parts.shift();
   if(parts.length!==2||!SERIES.includes(parts[0]))continue;
   const path='images/'+parts.join('/');
   imageEntries[path]=zip.files[originalPath];
  }
  await loadGalleryState();renderTabs();render();
 }catch(e){console.error(e);count.textContent='画像を読み込めません';grid.innerHTML='<div class="empty">aikatsu-images.zip がGitHubにアップロードされているか確認してください</div>'}
}
refreshButton.onclick=()=>{refreshButton.disabled=true;refreshButton.textContent='更新中…';location.href=location.pathname+'?refresh='+Date.now()};
async function makeOfferList(){
 const paths=[...selected].filter(p=>imageEntries[p]);
 if(!paths.length)return;
 makeListButton.disabled=true;makeListButton.textContent='画像を作成中…';listPreview.innerHTML='';
 try{
  const perPage=40,cols=4,cellW=400,cellH=205,totalPages=Math.ceil(paths.length/perPage);
  for(let page=0;page<totalPages;page++){
   const pagePaths=paths.slice(page*perPage,(page+1)*perPage),canvas=document.createElement('canvas');
   canvas.width=1600;canvas.height=125+10*cellH;
   const ctx=canvas.getContext('2d');
   ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.fillStyle='#3e6fb5';ctx.textAlign='center';ctx.font='bold 42px sans-serif';
   ctx.fillText('アイカツ！ お譲り可能リスト',800,57);
   ctx.fillStyle='#7894b1';ctx.font='20px sans-serif';
   ctx.fillText(new Date().toLocaleDateString('ja-JP')+'　'+(page+1)+' / '+totalPages,800,94);
   for(let i=0;i<pagePaths.length;i++){
    const path=pagePaths[i];
    let url=imageUrls[path];
    if(!url){const blob=await imageEntries[path].async('blob');url=URL.createObjectURL(blob);imageUrls[path]=url}
    const img=new Image();img.src=url;await img.decode();
    const col=i%cols,row=Math.floor(i/cols),x=col*cellW,y=125+row*cellH;
    ctx.fillStyle='#f7fbff';ctx.fillRect(x+7,y+5,cellW-14,cellH-10);
    ctx.strokeStyle='#dceeff';ctx.lineWidth=2;ctx.strokeRect(x+7,y+5,cellW-14,cellH-10);
    const maxW=150,maxH=165,scale=Math.min(maxW/img.width,maxH/img.height);
    const w=img.width*scale,h=img.height*scale;
    ctx.drawImage(img,x+(cellW-w)/2,y+7+(maxH-h)/2,w,h);
    const label=path.split('/').pop().replace(/\.[^.]+$/,'');
    ctx.fillStyle='#35516f';ctx.font='18px sans-serif';ctx.textAlign='center';
    ctx.fillText(label.length>38?label.slice(0,36)+'…':label,x+cellW/2,y+190);
   }
   const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
   if(!blob)throw new Error('PNG conversion failed');
   const url=URL.createObjectURL(blob),wrap=document.createElement('div');wrap.className='previewPage';
   const hint=document.createElement('p');hint.className='previewHint';hint.textContent='画像を長押しで保存可能です';
   const preview=document.createElement('img');preview.src=url;preview.alt='お譲り可能リスト '+(page+1)+'ページ';preview.draggable=true;
   const actions=document.createElement('div');actions.className='previewActions';
   const label=document.createElement('span');label.textContent=(page+1)+' / '+totalPages+'ページ（'+pagePaths.length+'枚）';
   const link=document.createElement('a');link.href=url;link.download='aikatsu-offer-list-'+(page+1)+'.png';link.textContent='この画像を保存';
   actions.append(label,link);wrap.append(hint,preview,actions);listPreview.appendChild(wrap);
  }
  listPreview.scrollIntoView({behavior:'smooth',block:'start'});
 }catch(e){console.error(e);alert('画像の作成に失敗しました。もう一度お試しください')}
 finally{makeListButton.disabled=false;makeListButton.textContent='お譲り可能リストを画像化'}
}
makeListButton.onclick=makeOfferList;
loadImages();
</script>
</body>
