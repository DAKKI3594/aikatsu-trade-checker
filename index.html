<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b9df6"><title>アイカツ！交換用カードチェッカー</title>
<style>
:root{--blue:#5b9df6;--blue2:#8bc8ff;--pale:#eaf6ff;--deep:#3e6fb5;--ink:#35516f;--pink:#ff9fcf}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eaf6ff 0,#f8fbff 240px,#fff 100%);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--ink)}header{padding:22px 14px 14px;text-align:center}h1{font-size:21px;color:var(--deep);margin:0 0 7px;font-weight:800}.sub{font-size:12px;color:#7290ad}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:0 10px 12px;max-width:900px;margin:auto}.tab{border:1px solid #c8e3ff;background:#fff;color:var(--deep);border-radius:13px;padding:11px 2px;font-size:13px;font-weight:700;box-shadow:0 2px 7px #8abcf022}.tab.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-color:transparent}.toolbar{max-width:900px;margin:0 auto 12px;padding:0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.count{font-size:13px;font-weight:700;color:var(--deep)}.filters{display:flex;gap:5px}.filter{border:1px solid #d5e8fa;background:#fff;color:#6685a5;border-radius:20px;padding:6px 10px;font-size:11px}.filter.active{background:#e1f1ff;color:var(--deep);border-color:#9bcaff}.grid{max-width:1000px;margin:auto;padding:0 8px 30px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.card{position:relative;border:2px solid #dceeff;border-radius:10px;background:#fff;padding:3px;overflow:hidden;box-shadow:0 2px 6px #6da7d51a;aspect-ratio:0.72;display:flex;align-items:center;justify-content:center;cursor:pointer; -webkit-tap-highlight-color:transparent}.card img{width:100%;height:100%;object-fit:contain;display:block}.card.owned{border-color:#5b9df6;background:#edf7ff}.card.owned:after{content:"✓";position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#5b9df6;color:#fff;font-size:15px;font-weight:900;display:grid;place-items:center;box-shadow:0 1px 4px #0002}.card.owned img{opacity:.68}.empty{grid-column:1/-1;text-align:center;color:#91a8bf;padding:40px 10px;font-size:14px}.foot{text-align:center;color:#9ab0c5;font-size:11px;padding:0 10px 25px}.reset{border:0;background:none;color:#8aa5bf;font-size:11px;text-decoration:underline;padding:4px}@media(min-width:700px){.grid{gap:12px;padding-left:14px;padding-right:14px}.card{border-radius:13px;padding:5px}.tab{font-size:15px}}
</style></head><body>

<main class="grid" id="grid"></main><div class="foot">チェック内容はこの端末のブラウザに自動保存されます<br><button class="reset" id="reset">このシリーズのチェックをリセット</button></div>

let imageUrls={};
async function loadImages(){
  const grid=document.getElementById('grid');
  document.getElementById('count').textContent='画像を読み込み中…';
  try{
    const response=await fetch('aikatsu-images.zip');
    if(!response.ok) throw new Error('ZIPを読み込めません');
    const zip=await JSZip.loadAsync(await response.arrayBuffer());
    for(const name of Object.keys(zip.files)){
      if(zip.files[name].dir || !name.startsWith('images/')) continue;
      const blob=await zip.files[name].async('blob');
      imageUrls[name]=URL.createObjectURL(blob);
    }
    renderTabs();render();
  }catch(error){
    document.getElementById('count').textContent='画像を読み込めません。ZIPのアップロードを確認してください';
    grid.innerHTML='<div class=\"empty\">aikatsu-images.zip が見つかりません</div>'
  }
}

let current='初代',filter='all';let owned={};try{owned=JSON.parse(localStorage.getItem('aikatsuTradeOwnedV1')||'{}')||{}}catch(e){}
const tabs=document.getElementById('tabs'),grid=document.getElementById('grid'),count=document.getElementById('count');
function key(s,f){return s+'/'+f}function save(){localStorage.setItem('aikatsuTradeOwnedV1',JSON.stringify(owned))}
function renderTabs(){tabs.innerHTML='';SERIES.forEach(s=>{const b=document.createElement('button');b.className='tab'+(s===current?' active':'');b.textContent=s;b.onclick=()=>{current=s;filter='all';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));renderTabs();render()};tabs.appendChild(b)})}
function render(){const arr=FILES[current]||[];const have=arr.filter(f=>owned[key(current,f)]).length;count.textContent=`${current}　${have} / ${arr.length} 枚 所持`;grid.innerHTML='';let shown=arr.filter(f=>filter==='all'||(filter==='owned'?!!owned[key(current,f)]:!owned[key(current,f)]));if(!shown.length){grid.innerHTML='<div class="empty">表示するカードはありません</div>';return}shown.forEach(f=>{const el=document.createElement('button');el.type='button';el.className='card'+(owned[key(current,f)]?' owned':'');el.setAttribute('aria-label',owned[key(current,f)]?'所持済み。タップで未所持にする':'未所持。タップで所持済みにする');const img=document.createElement('img');img.loading='lazy';img.alt='';img.src=imageUrls['images/'+current+'/'+f]||'';el.appendChild(img);el.onclick=()=>{const k=key(current,f);owned[k]=!owned[k];if(!owned[k])delete owned[k];save();render()};grid.appendChild(el)})}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('reset').onclick=()=>{if(!confirm(current+'の所持チェックをすべてリセットしますか？'))return;Object.keys(owned).filter(k=>k.startsWith(current+'/')).forEach(k=>delete owned[k]);save();render()};loadImages();
